<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <title>Terrain</title>
        <meta name="description" content="A demo of the THREE.Terrain library." />
        <link rel="icon" href="demo/img/favicon.png" />
        <link rel="stylesheet" href="demo/index.css" />
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <canvas id="heightmap"></canvas>
        <div id="show-analytics" class="visible">Analyze</div>
        <div id="analytics" class=""></div>
        <div id="code">
            <a href="https://github.com/IceCreamYou/THREE.Terrain" target="_blank">Fork me on Github</a>
        </div>
        <div id="fpscontrols">
            W = Forward, S = Back, A = Left, D = Right, R = Up, F = Down, Q = Freeze, Mouse = Look
        </div>

        <!-- Demo -->
        <script src="demo/libs/dat.gui.min.js"></script>
        
        <script type="module">
            import { Demo } from "./demo/Demo.js";
            // or
            //import { Demo } from "./demo/Demo.js";

            let demo = new Demo();

            let thisPath = "";

            let textures = [
                thisPath + "demo/img/sky1.jpg",
                thisPath + "demo/img/sand1.jpg",
                thisPath + "demo/img/grass1.jpg",
                thisPath + "demo/img/stone1.jpg",
                thisPath + "demo/img/snow1.jpg",
            ];

            let callback = function(preloaded){
                demo.setup(preloaded)
            }

            demo.preloadTextures(textures, callback);

        </script>
    </body>
</html>
